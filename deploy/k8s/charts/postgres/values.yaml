image:
  repository: postgres
  tag: "18.6-trixie"
  pullPolicy: IfNotPresent

auth:
  username: app
  database: app
  password: ""
  sslMode: disable

service:
  port: 5432

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

shm:
  size: 256Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

startupProbe:
  periodSeconds: 5
  failureThreshold: 30

readinessProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

terminationGracePeriodSeconds: 60

nodeSelector: {}
tolerations: []
affinity: {}
